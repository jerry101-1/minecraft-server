<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ 殭屍生存 - 多人連線</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #info .online {
            color: #44ff88;
        }
        #status {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.2);
            font-size: 30px;
            pointer-events: none;
            z-index: 10;
            font-weight: 100;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            line-height: 1.8;
            font-family: 'Courier New', monospace;
        }
        #players {
            position: absolute;
            top: 110px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.3);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        #players .p {
            margin: 2px 0;
        }
        .green { color: #44ff88; }
        .gray { color: #666; }
    </style>
</head>
<body>

    <div id="info">
        ⛏️ <span id="serverName">殭屍生存</span>
        <span class="online">●</span> <span id="onlineCount">0</span> 在線
    </div>
    <div id="status">🔄 連線中...</div>
    <div id="crosshair">✚</div>
    <div id="players"></div>
    <div id="controls">WASD 移動 · 滑鼠瞄準 · 點擊射擊 · 多人連線</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        //  連線設定
        // ============================================================
        const WS_URL = 'wss://minecraft-server-6ifr.onrender.com';
        let ws = null;
        let playerId = null;
        let players = {};

        const statusEl = document.getElementById('status');
        const onlineCountEl = document.getElementById('onlineCount');
        const playersListEl = document.getElementById('players');

        // ============================================================
        //  Three.js 場景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2a3a);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        //  燈光
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x446688, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffddaa, 1.2);
        dirLight.position.set(10, 20, 5);
        scene.add(dirLight);

        // ============================================================
        //  地面
        // ============================================================
        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x2a4a3a,
            roughness: 0.9,
            metalness: 0,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // 網格
        const gridHelper = new THREE.GridHelper(40, 20, 0x3a6a4a, 0x2a4a3a);
        gridHelper.position.y = -0.45;
        scene.add(gridHelper);

        // ============================================================
        //  樹木裝飾
        // ============================================================
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.15, 0.8, 6),
                new THREE.MeshStandardMaterial({ color: 0x6a4a2a })
            );
            trunk.position.y = 0.4;
            group.add(trunk);
            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x3a8a3a })
            );
            leaves.position.y = 0.9;
            group.add(leaves);
            group.position.set(x, 0, z);
            scene.add(group);
        }
        for (let i = 0; i < 15; i++) {
            const x = (Math.random() - 0.5) * 30;
            const z = (Math.random() - 0.5) * 30;
            if (Math.abs(x) < 2 && Math.abs(z) < 2) continue;
            createTree(x, z);
        }

        // ============================================================
        //  玩家方塊
        // ============================================================
        function createPlayerCube(color = 0x44ddff) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.8, 0.6),
                new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 })
            );
            body.position.y = 0.4;
            group.add(body);
            const head = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.4, 0.4),
                new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.5 })
            );
            head.position.y = 0.9;
            group.add(head);
            // 眼睛
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222244 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.02), eyeMat);
            eyeL.position.set(-0.12, 0.95, 0.2);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.02), eyeMat);
            eyeR.position.set(0.12, 0.95, 0.2);
            group.add(eyeR);
            return group;
        }

        const localPlayer = createPlayerCube(0x44ddff);
        scene.add(localPlayer);

        const otherPlayers = {};

        // ============================================================
        //  遊戲控制
        // ============================================================
        const keys = { w: false, a: false, s: false, d: false };
        let isLocked = false;
        let moveSpeed = 3.5;

        document.addEventListener('click', () => {
            if (!isLocked) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            camera.rotation.order = 'YXZ';
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-0.6, Math.min(0.8, camera.rotation.x));
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // ============================================================
        //  WebSocket 連線
        // ============================================================
        function connectWebSocket() {
            statusEl.textContent = '🔄 連線中...';
            statusEl.style.color = '#ffaa44';

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                statusEl.textContent = '✅ 已連線到伺服器';
                statusEl.style.color = '#44ff88';
            };

            ws.onclose = () => {
                statusEl.textContent = '❌ 斷線，重新連線中...';
                statusEl.style.color = '#ff4444';
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = () => {
                statusEl.textContent = '⚠️ 連線錯誤';
                statusEl.style.color = '#ff8844';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('解析訊息錯誤:', e);
                }
            };
        }

        function handleMessage(data) {
            if (data.type === 'init') {
                playerId = data.id;
                console.log('✅ 玩家 ID:', playerId);
                // 初始化其他玩家
                if (data.players) {
                    for (const p of data.players) {
                        if (p.id !== playerId) {
                            addOtherPlayer(p.id, p.x, p.z);
                        }
                    }
                }
                updatePlayersList();
            }
            else if (data.type === 'player_join') {
                if (data.id !== playerId) {
                    addOtherPlayer(data.id, data.x, data.z);
                }
                updatePlayersList();
            }
            else if (data.type === 'update') {
                if (data.id !== playerId) {
                    updateOtherPlayer(data.id, data.x, data.z);
                }
            }
            else if (data.type === 'player_leave') {
                removeOtherPlayer(data.id);
                updatePlayersList();
            }
        }

        function addOtherPlayer(id, x, z) {
            if (otherPlayers[id]) return;
            const cube = createPlayerCube(0xff6644);
            cube.position.set(x, 0, z);
            scene.add(cube);
            otherPlayers[id] = { mesh: cube, x, z };
            console.log('🟢 玩家', id, '加入');
        }

        function updateOtherPlayer(id, x, z) {
            if (otherPlayers[id]) {
                otherPlayers[id].x = x;
                otherPlayers[id].z = z;
            }
        }

        function removeOtherPlayer(id) {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id].mesh);
                delete otherPlayers[id];
                console.log('🔴 玩家', id, '離開');
            }
        }

        function updatePlayersList() {
            const count = Object.keys(otherPlayers).length + 1;
            onlineCountEl.textContent = count;
            let html = '';
            html += `<div class="p green">● 你</div>`;
            for (const id in otherPlayers) {
                html += `<div class="p gray">● 玩家 ${id}</div>`;
            }
            playersListEl.innerHTML = html;
        }

        // ============================================================
        //  發送位置
        // ============================================================
        let lastSendTime = 0;

        function sendPosition() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const now = performance.now();
            if (now - lastSendTime < 50) return;
            lastSendTime = now;
            ws.send(JSON.stringify({
                type: 'move',
                x: localPlayer.position.x,
                z: localPlayer.position.z,
                rotX: camera.rotation.x,
                rotY: camera.rotation.y
            }));
        }

        // ============================================================
        //  動畫循環
        // ============================================================
        function updatePlayer(delta) {
            if (!isLocked) return;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            const move = new THREE.Vector3();
            if (keys.w) move.add(forward);
            if (keys.s) move.sub(forward);
            if (keys.a) move.sub(right);
            if (keys.d) move.add(right);

            if (move.length() > 0) {
                move.normalize().multiplyScalar(moveSpeed * delta);
                localPlayer.position.x += move.x;
                localPlayer.position.z += move.z;
                // 限制範圍
                localPlayer.position.x = Math.max(-18, Math.min(18, localPlayer.position.x));
                localPlayer.position.z = Math.max(-18, Math.min(18, localPlayer.position.z));
            }

            // 更新相機位置
            camera.position.x = localPlayer.position.x;
            camera.position.z = localPlayer.position.z;
            camera.position.y = 1.8;

            // 更新其他玩家位置（平滑移動）
            for (const id in otherPlayers) {
                const p = otherPlayers[id];
                p.mesh.position.x += (p.x - p.mesh.position.x) * 0.1;
                p.mesh.position.z += (p.z - p.mesh.position.z) * 0.1;
            }

            sendPosition();
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016;
            updatePlayer(delta);
            renderer.render(scene, camera);
        }

        // ============================================================
        //  視窗調整
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        //  啟動
        // ============================================================
        connectWebSocket();
        animate();

        console.log('⛏️ 殭屍生存 - 多人連線版');
        console.log('🌐 伺服器:', WS_URL);
        console.log('📖 WASD移動 | 滑鼠瞄準 | 點擊鎖定');
    </script>
</body>
</html>
